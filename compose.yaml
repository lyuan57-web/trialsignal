services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      TRIALSIGNAL_DB: /app/data/trialsignal.db
      TRIALSIGNAL_MODEL: /app/models/adverse_outcome.joblib
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

